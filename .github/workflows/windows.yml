name: Windows regression tests
on:
  push:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore: ['**.md', '**.mdx', '**.rst', '**.docx', '**.pdf', '**/LICENSE', '**/LICENSE.*', '**/NOTICE', '**/NOTICE.*', 'docs/**.png', 'docs/**.jpg', 'docs/**.svg', 'docs/**.gif', 'docs/**.webp', 'docs/**.html', 'docs/**.css']
  pull_request:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore: ['**.md', '**.mdx', '**.rst', '**.docx', '**.pdf', '**/LICENSE', '**/LICENSE.*', '**/NOTICE', '**/NOTICE.*', 'docs/**.png', 'docs/**.jpg', 'docs/**.svg', 'docs/**.gif', 'docs/**.webp', 'docs/**.html', 'docs/**.css']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows PowerShell 5.1 regression and parse checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('Test-BlockAudit','Test-Reconcile','Test-Recovery','Test-SettingsMerge','Test-UninstallBakFilter','Test-Lifecycle','Test-NoBOM','Test-NoHardcodedPaths','Test-HelperInstall','Test-AuditRegressions','Test-CiStandard')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tests/$test.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
