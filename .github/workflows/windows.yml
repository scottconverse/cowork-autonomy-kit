name: Windows regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows PowerShell 5.1 regression and parse checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('Test-SettingsMerge','Test-UninstallBakFilter','Test-Lifecycle','Test-NoBOM','Test-NoHardcodedPaths','Test-HelperInstall','Test-AuditRegressions')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tests/$test.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
