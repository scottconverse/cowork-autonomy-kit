name: Weekly scan
on:
  push:
    paths: ['src/**']
  schedule:
    - cron: "0 3 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SCAN_MINUTES) }}
    steps:
      - run: echo scan
